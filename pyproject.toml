[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drishti"
version = "2.0.0"
description = "Evidence-first intelligence and knowledge-graph platform: multi-source extraction, entity resolution, bitemporal claim graph, graph analytics, grounded assistant."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.5",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "networkx>=3.2",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
fast = ["rapidfuzz>=3.6", "opencv-python-headless>=4.9"]
nlp = ["spacy>=3.7"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
drishti = "drishti.cli:main"

[tool.setuptools.packages.find]
include = ["drishti*"]

[tool.setuptools.package-data]
drishti = ["api/static/*.html", "api/static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
